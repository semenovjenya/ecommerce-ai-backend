      DECISION_SIMULATION_MODE: "${DECISION_SIMULATION_MODE:-off}"
      DECISION_SIMULATION_PRICING_MODE: "${DECISION_SIMULATION_PRICING_MODE:-off}"
      DECISION_SIMULATION_QUEUE_NAME: "${DECISION_SIMULATION_QUEUE_NAME:-decision-simulations}"
      DECISION_SIMULATION_MAINTENANCE_QUEUE_NAME: "${DECISION_SIMULATION_MAINTENANCE_QUEUE_NAME:-decision-simulations-maintenance}"
      DECISION_SIMULATION_SAMPLE_COUNT: "${DECISION_SIMULATION_SAMPLE_COUNT:-500}"
      DECISION_SIMULATION_BATCH_SIZE: "${DECISION_SIMULATION_BATCH_SIZE:-50}"
      DECISION_SIMULATION_JOB_TIMEOUT_SECONDS: "${DECISION_SIMULATION_JOB_TIMEOUT_SECONDS:-900}"
      DECISION_SIMULATION_STALE_AFTER_SECONDS: "${DECISION_SIMULATION_STALE_AFTER_SECONDS:-1200}"
      DECISION_SIMULATION_LLM_CRITIC_ENABLED: "${DECISION_SIMULATION_LLM_CRITIC_ENABLED:-true}"
      DECISION_SIMULATION_METRICS_PORT: "${DECISION_SIMULATION_METRICS_PORT:-9101}"
      EXPERIMENT_PROGRAM_AUTO_ATTACH: "${EXPERIMENT_PROGRAM_AUTO_ATTACH:-false}"
      SIMULATION_WORKER_MODE: "${SIMULATION_WORKER_MODE:-worker}"
      SIMULATION_WORKER_ROLE: "worker"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/decision-simulation-prometheus"
    expose:
      - "9101"
    depends_on:
      postgresmemory:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  simulation-reconciler:
    extends:
      service: simulation-worker
    container_name: ai-ecom-simulation-reconciler
    environment:
      SIMULATION_WORKER_ROLE: "reconciler"
      DECISION_SIMULATION_METRICS_PORT: "${DECISION_SIMULATION_RECONCILER_METRICS_PORT:-9102}"
    expose:
      - "9102"

  experiment-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-ecom-experiment-worker
    restart: unless-stopped
    command: ["python", "-m", "agi_ecom_app.experiment_program_worker"]
    environment:
      MEMORY_POSTGRES_HOST: "postgresmemory"
      MEMORY_POSTGRES_PORT: "5432"
      MEMORY_POSTGRES_DB: "${MEMORY_POSTGRES_DB:-postgresmemory}"
      MEMORY_POSTGRES_USER: "${MEMORY_POSTGRES_USER:-postgresmemory_user}"
      MEMORY_POSTGRES_PASSWORD: "${MEMORY_POSTGRES_PASSWORD:-portfolio_local_password}"
      MEMORY_POSTGRES_SSLMODE: "${MEMORY_POSTGRES_SSLMODE:-disable}"
      MEMORY_POSTGRES_POOL_MIN_SIZE: "${MEMORY_POSTGRES_POOL_MIN_SIZE:-1}"
