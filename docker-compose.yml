services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENAI_MEMORY_MODEL: "${OPENAI_MEMORY_MODEL:-gpt-4.1-mini}"
      LLM_MODEL_PROFILE: "${LLM_MODEL_PROFILE:-openai_default}"
      LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-false}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}"
      LANGFUSE_TRACING_ENVIRONMENT: "${LANGFUSE_TRACING_ENVIRONMENT:-development}"
      LANGFUSE_RELEASE: "${LANGFUSE_RELEASE:-}"
      LANGFUSE_SAMPLE_RATE: "${LANGFUSE_SAMPLE_RATE:-1.0}"
      LANGFUSE_CAPTURE_MODE: "${LANGFUSE_CAPTURE_MODE:-full}"
      LANGFUSE_MAX_FIELD_BYTES: "${LANGFUSE_MAX_FIELD_BYTES:-262144}"
      LANGFUSE_OPENAI_AGENTS_DUAL_EXPORT: "${LANGFUSE_OPENAI_AGENTS_DUAL_EXPORT:-true}"
      SUPPLY_LATEST_KNOWN_AS_CURRENT: "${SUPPLY_LATEST_KNOWN_AS_CURRENT:-false}"
      LANGFUSE_SERVICE_NAME: "backend"
      LANGFUSE_WORKER_ROLE: "api"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_HTTP_REFERER: "${OPENROUTER_HTTP_REFERER:-}"
      OPENROUTER_TITLE: "${OPENROUTER_TITLE:-AI-ECOM Backend}"
      POSTGRES_HOST: "${ANALYTICS_POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "${ANALYTICS_POSTGRES_PORT:-55434}"
      POSTGRES_DB: "${ANALYTICS_POSTGRES_DB:-wb_demo}"
      POSTGRES_USER: "${ANALYTICS_POSTGRES_USER:-wb_user}"
      POSTGRES_PASSWORD: "${ANALYTICS_POSTGRES_PASSWORD:-}"
      POSTGRES_SSLMODE: "${ANALYTICS_POSTGRES_SSLMODE:-disable}"
      POSTGRES_POOL_MIN_SIZE: "${POSTGRES_POOL_MIN_SIZE:-1}"
      POSTGRES_POOL_MAX_SIZE: "${POSTGRES_POOL_MAX_SIZE:-10}"
      POSTGRES_POOL_TIMEOUT_SECONDS: "${POSTGRES_POOL_TIMEOUT_SECONDS:-10}"
      MEMORY_POSTGRES_HOST: "postgresmemory"
      MEMORY_POSTGRES_PORT: "5432"
      MEMORY_POSTGRES_DB: "${MEMORY_POSTGRES_DB:-postgresmemory}"
      MEMORY_POSTGRES_USER: "${MEMORY_POSTGRES_USER:-postgresmemory_user}"
      MEMORY_POSTGRES_PASSWORD: "${MEMORY_POSTGRES_PASSWORD:-portfolio_local_password}"
      MEMORY_POSTGRES_SSLMODE: "${MEMORY_POSTGRES_SSLMODE:-disable}"
      MEMORY_POSTGRES_POOL_MIN_SIZE: "${MEMORY_POSTGRES_POOL_MIN_SIZE:-1}"
      MEMORY_POSTGRES_POOL_MAX_SIZE: "${MEMORY_POSTGRES_POOL_MAX_SIZE:-10}"
      MEMORY_POSTGRES_POOL_TIMEOUT_SECONDS: "${MEMORY_POSTGRES_POOL_TIMEOUT_SECONDS:-10}"
      DALKOS_POSTGRES_HOST: "${DALKOS_POSTGRES_HOST:-host.docker.internal}"
      DALKOS_POSTGRES_PORT: "${DALKOS_POSTGRES_PORT:-4444}"
      DALKOS_POSTGRES_DB: "${DALKOS_POSTGRES_DB:-contracts_demo}"
      DALKOS_POSTGRES_USER: "${DALKOS_POSTGRES_USER:-demo_user}"
      DALKOS_POSTGRES_PASSWORD: "${DALKOS_POSTGRES_PASSWORD:-}"
      DALKOS_POSTGRES_SSLMODE: "${DALKOS_POSTGRES_SSLMODE:-disable}"
      MEMORY_CONTEXT_MESSAGE_LIMIT: "${MEMORY_CONTEXT_MESSAGE_LIMIT:-12}"
      REDIS_URL: "redis://redis:6379/0"
      AGENT_QUEUE_NAME: "${AGENT_QUEUE_NAME:-agent-runs}"
      AGENT_JOB_TIMEOUT_SECONDS: "${AGENT_JOB_TIMEOUT_SECONDS:-900}"
      AGENT_WORKFLOW_VERSION: "${AGENT_WORKFLOW_VERSION:-v1}"
      MANAGER_DECISION_ENABLED: "${MANAGER_DECISION_ENABLED:-false}"
      DECISION_SIMULATION_MODE: "${DECISION_SIMULATION_MODE:-off}"
      DECISION_SIMULATION_PRICING_MODE: "${DECISION_SIMULATION_PRICING_MODE:-off}"
      DECISION_SIMULATION_QUEUE_NAME: "${DECISION_SIMULATION_QUEUE_NAME:-decision-simulations}"
      DECISION_SIMULATION_MAINTENANCE_QUEUE_NAME: "${DECISION_SIMULATION_MAINTENANCE_QUEUE_NAME:-decision-simulations-maintenance}"
      DECISION_SIMULATION_SAMPLE_COUNT: "${DECISION_SIMULATION_SAMPLE_COUNT:-500}"
      DECISION_SIMULATION_BATCH_SIZE: "${DECISION_SIMULATION_BATCH_SIZE:-50}"
      DECISION_SIMULATION_JOB_TIMEOUT_SECONDS: "${DECISION_SIMULATION_JOB_TIMEOUT_SECONDS:-900}"
      DECISION_SIMULATION_STALE_AFTER_SECONDS: "${DECISION_SIMULATION_STALE_AFTER_SECONDS:-1200}"
      DECISION_SIMULATION_LLM_CRITIC_ENABLED: "${DECISION_SIMULATION_LLM_CRITIC_ENABLED:-true}"
      EXPERIMENT_PROGRAM_QUEUE_NAME: "${EXPERIMENT_PROGRAM_QUEUE_NAME:-experiment-programs}"
      EXPERIMENT_PROGRAM_JOB_TIMEOUT_SECONDS: "${EXPERIMENT_PROGRAM_JOB_TIMEOUT_SECONDS:-900}"
      EXPERIMENT_PROGRAM_OUTBOX_LEASE_SECONDS: "${EXPERIMENT_PROGRAM_OUTBOX_LEASE_SECONDS:-60}"
      EXPERIMENT_PROGRAM_OUTBOX_RECOVERY_SECONDS: "${EXPERIMENT_PROGRAM_OUTBOX_RECOVERY_SECONDS:-30}"
      EXPERIMENT_PROGRAM_STALE_AFTER_SECONDS: "${EXPERIMENT_PROGRAM_STALE_AFTER_SECONDS:-300}"
      EXPERIMENT_PROGRAM_SIMULATION_MAX_RECONCILES: "${EXPERIMENT_PROGRAM_SIMULATION_MAX_RECONCILES:-3}"
      EXPERIMENT_PROGRAM_AUTO_ATTACH: "${EXPERIMENT_PROGRAM_AUTO_ATTACH:-false}"
      MANAGER_DAILY_ENABLED: "${MANAGER_DAILY_ENABLED:-false}"
      MANAGER_DAILY_HOUR: "${MANAGER_DAILY_HOUR:-9}"
      MANAGER_DAILY_TIMEZONE: "${MANAGER_DAILY_TIMEZONE:-Europe/Moscow}"
      MANAGER_DAILY_CHAT_ID: "${MANAGER_DAILY_CHAT_ID:-manager-daily}"
      MANAGER_JWT_SECRET: "${MANAGER_JWT_SECRET:-}"
      MANAGER_JWT_TTL_SECONDS: "${MANAGER_JWT_TTL_SECONDS:-900}"
      MANAGER_JWT_ISSUER: "${MANAGER_JWT_ISSUER:-ai-ecom-manager}"
      MANAGER_BOOTSTRAP_ADMIN_USERNAME: "${MANAGER_BOOTSTRAP_ADMIN_USERNAME:-}"
      MANAGER_BOOTSTRAP_ADMIN_PASSWORD: "${MANAGER_BOOTSTRAP_ADMIN_PASSWORD:-}"
      WB_ADS_WRITE_ENABLED: "${WB_ADS_WRITE_ENABLED:-false}"
      WB_PRICE_WRITE_ENABLED: "${WB_PRICE_WRITE_ENABLED:-false}"
      WB_API_SANDBOX: "${WB_API_SANDBOX:-true}"
      WB_PROMOTION_TOKEN: "${WB_PROMOTION_TOKEN:-}"
      WB_PRICES_TOKEN: "${WB_PRICES_TOKEN:-}"
      AIRFLOW_BASE_URL: "${AIRFLOW_BASE_URL:-http://host.docker.internal:8082}"
      AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:-admin}"
      AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD:-admin}"
      AIRFLOW_CONTRACT_DAG_ID: "${AIRFLOW_CONTRACT_DAG_ID:-contract_document_ingest}"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
    depends_on:
      postgresmemory:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

