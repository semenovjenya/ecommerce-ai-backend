      EXPERIMENT_PROGRAM_OUTBOX_LEASE_SECONDS: "${EXPERIMENT_PROGRAM_OUTBOX_LEASE_SECONDS:-60}"
      EXPERIMENT_PROGRAM_OUTBOX_RECOVERY_SECONDS: "${EXPERIMENT_PROGRAM_OUTBOX_RECOVERY_SECONDS:-30}"
      EXPERIMENT_PROGRAM_STALE_AFTER_SECONDS: "${EXPERIMENT_PROGRAM_STALE_AFTER_SECONDS:-300}"
      EXPERIMENT_PROGRAM_SIMULATION_MAX_RECONCILES: "${EXPERIMENT_PROGRAM_SIMULATION_MAX_RECONCILES:-3}"
    depends_on:
      postgresmemory:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgresmemory:
    image: postgres:16
    container_name: postgresmemory
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEMORY_POSTGRES_PORT:-55435}:5432"
    environment:
      POSTGRES_DB: "${MEMORY_POSTGRES_DB:-postgresmemory}"
      POSTGRES_USER: "${MEMORY_POSTGRES_USER:-postgresmemory_user}"
      POSTGRES_PASSWORD: "${MEMORY_POSTGRES_PASSWORD:-portfolio_local_password}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MEMORY_POSTGRES_USER:-postgresmemory_user} -d ${MEMORY_POSTGRES_DB:-postgresmemory}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgresmemory_data:/var/lib/postgresql/data
      - ./docker/postgresmemory/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgresmemory/02_experiment_program.sql:/docker-entrypoint-initdb.d/02_experiment_program.sql:ro

  redis:
    image: redis:7-alpine
    container_name: agi-ecom-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

