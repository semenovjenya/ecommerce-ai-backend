      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  simulation-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "-m", "agi_ecom_app.simulation_worker"]
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENAI_MEMORY_MODEL: "${OPENAI_MEMORY_MODEL:-gpt-4.1-mini}"
      LLM_MODEL_PROFILE: "${LLM_MODEL_PROFILE:-openai_default}"
      LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-false}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}"
      LANGFUSE_TRACING_ENVIRONMENT: "${LANGFUSE_TRACING_ENVIRONMENT:-development}"
      LANGFUSE_RELEASE: "${LANGFUSE_RELEASE:-}"
      LANGFUSE_SAMPLE_RATE: "${LANGFUSE_SAMPLE_RATE:-1.0}"
      LANGFUSE_CAPTURE_MODE: "${LANGFUSE_CAPTURE_MODE:-full}"
      LANGFUSE_MAX_FIELD_BYTES: "${LANGFUSE_MAX_FIELD_BYTES:-262144}"
      LANGFUSE_OPENAI_AGENTS_DUAL_EXPORT: "${LANGFUSE_OPENAI_AGENTS_DUAL_EXPORT:-true}"
      LANGFUSE_SERVICE_NAME: "simulation-worker"
      LANGFUSE_WORKER_ROLE: "simulation-job"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_HTTP_REFERER: "${OPENROUTER_HTTP_REFERER:-}"
      OPENROUTER_TITLE: "${OPENROUTER_TITLE:-AI-ECOM Backend}"
      POSTGRES_HOST: "${ANALYTICS_POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "${ANALYTICS_POSTGRES_PORT:-55434}"
      POSTGRES_DB: "${ANALYTICS_POSTGRES_DB:-wb_demo}"
      POSTGRES_USER: "${ANALYTICS_POSTGRES_USER:-wb_user}"
      POSTGRES_PASSWORD: "${ANALYTICS_POSTGRES_PASSWORD:-}"
      POSTGRES_SSLMODE: "${ANALYTICS_POSTGRES_SSLMODE:-disable}"
      POSTGRES_POOL_MIN_SIZE: "${POSTGRES_POOL_MIN_SIZE:-1}"
      POSTGRES_POOL_MAX_SIZE: "${POSTGRES_POOL_MAX_SIZE:-10}"
      POSTGRES_POOL_TIMEOUT_SECONDS: "${POSTGRES_POOL_TIMEOUT_SECONDS:-10}"
      MEMORY_POSTGRES_HOST: "postgresmemory"
      MEMORY_POSTGRES_PORT: "5432"
      MEMORY_POSTGRES_DB: "${MEMORY_POSTGRES_DB:-postgresmemory}"
      MEMORY_POSTGRES_USER: "${MEMORY_POSTGRES_USER:-postgresmemory_user}"
      MEMORY_POSTGRES_PASSWORD: "${MEMORY_POSTGRES_PASSWORD:-portfolio_local_password}"
